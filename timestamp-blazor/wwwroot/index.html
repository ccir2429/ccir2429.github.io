<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Capitole YouTube Live</title>
    <base href="/" />
    <!--
      Companion to 404.html: restores the deep-linked path (e.g. /viewer)
      that GitHub Pages redirected here as a query string, before Blazor's
      router starts. See: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location));
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
</head>
<body>
    <div id="app">Se încarcă…</div>

    <div id="blazor-error-ui">
        A apărut o eroare neașteptată.
        <a href="" class="reload">Reîncarcă</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/config.js"></script>
    <script src="js/interop.js"></script>
    <script src="js/sse-interop.js"></script>
    <script src="js/youtube-interop.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
