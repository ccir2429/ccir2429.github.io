<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notițe rapide (doar citire)</title>
<style>
:root{--bg:#e8ecef;--panel:#fff;--ink:#16212a;--mute:#5b6a76;--line:#c9d2d9;--field:#f5f7f9}
@media (prefers-color-scheme:dark){:root{--bg:#12181d;--panel:#1b242b;--ink:#e6ecf0;--mute:#8a9aa6;--line:#2f3c46;--field:#141b20}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
main{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
h1{font-size:18px;margin:0}
p{margin:2px 0 8px;color:var(--mute);font-size:13px}
form{display:flex;gap:8px;margin-top:10px}
input{flex:1;min-width:0;background:var(--field);color:inherit;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font:inherit}
button{font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer}
input,button{font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
button{cursor:pointer}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row input{flex:1 1 140px;min-width:0}
#msg{flex:3 1 220px}
textarea{flex:1;resize:none;width:100%;background:var(--field);color:inherit;border:1px solid var(--line);border-radius:4px;padding:10px;font:inherit}
</style>
</head>
<body>
<main>
  <h1>Notițe rapide</h1>
  <p id="st" aria-live="polite">Se conectează…</p>
  <textarea id="t" readonly aria-label="Notițe rapide, doar citire"></textarea>
  <div class="row">
    <input type="text" id="nick" maxlength="40" placeholder="Poreclă (opțional)" aria-label="Poreclă">
    <input type="password" id="key" placeholder="Cheie de scriere" autocomplete="off" aria-label="Cheie de scriere">
  </div>
  <div class="row">
    <input type="text" id="msg" maxlength="500" placeholder="Scrie un mesaj pentru notițe" aria-label="Mesaj">
    <button id="send">Trimite</button>
  </div>
  <p id="ss" aria-live="polite" style="margin:6px 0 0"></p>
  <form id="f">
    <input id="m" maxlength="500" placeholder="Scrie o informație pentru aplicația principală" autocomplete="off" aria-label="Mesaj">
    <button type="submit">Trimite</button>
  </form>
  <p id="ms" aria-live="polite" style="margin:6px 0 0"></p>
</main>
<script src="config.js"></script>
<script>
const DB=((window.CFG&&CFG.dbUrl)||'').replace(/\/+$/,'');
const t=document.getElementById('t'),st=document.getElementById('st');
if(!DB){st.textContent='Lipsește dbUrl în config.js.'}
else{
  const es=new EventSource(DB+'/notes/live/text.json');
  es.addEventListener('put',e=>{
    try{const m=JSON.parse(e.data);if(m.path==='/'){t.value=typeof m.data==='string'?m.data:'';st.textContent='Live: se actualizează automat'}}catch(x){}
  });
  es.onerror=()=>{st.textContent='Conexiune întreruptă, se reconectează…'};
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const m=document.getElementById('m'),ms=document.getElementById('ms'),txt=m.value.trim();
  if(!txt||!DB)return;
  try{
    const r=await fetch(DB+'/notes/inbox.json',{method:'POST',body:JSON.stringify({text:txt,at:Date.now()})});
    if(r.ok){m.value='';ms.textContent='Trimis. Apare la finalul notițelor din aplicația principală.'}
    else ms.textContent='Nu s-a putut trimite ('+r.status+'). Verifică regulile Firebase.';
  }catch(x){ms.textContent='Fără conexiune. Mesajul nu a fost trimis.'}
});

const $=id=>document.getElementById(id),ss=$('ss');
const KEYOK=/^[A-Za-z0-9_-]{8,}$/;
const ls={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
$('nick').value=ls.get('v_nick');$('key').value=ls.get('v_key');
$('nick').addEventListener('change',()=>ls.set('v_nick',$('nick').value.trim()));
$('key').addEventListener('change',()=>ls.set('v_key',$('key').value.trim()));
async function send(){
  const m=$('msg').value.trim(),k=$('key').value.trim(),n=$('nick').value.trim()||'Anonim';
  if(!DB){ss.textContent='Lipsește dbUrl în config.js.';return}
  if(!m){ss.textContent='Scrie un mesaj.';return}
  if(!KEYOK.test(k)){ss.textContent='Introdu cheia de scriere (minim 8 caractere: litere, cifre, - sau _).';return}
  ls.set('v_nick',n==='Anonim'?'':n);ls.set('v_key',k);
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  $('send').disabled=true;
  try{
    const r=await fetch(DB+'/notes/inbox/'+k+'/'+id+'.json',{method:'PUT',body:JSON.stringify({n,m,at:Date.now()})});
    if(r.ok){$('msg').value='';ss.textContent='Trimis.'}
    else ss.textContent=(r.status===401||r.status===403)?'Cheie de scriere greșită.':'Eroare la trimitere ('+r.status+').';
  }catch(e){ss.textContent='Fără conexiune.'}
  $('send').disabled=false;
}
$('send').onclick=send;
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
