name: Publică pe GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Folderul proiectului care are config.template.js (relativ la rădăcina repository-ului)
  PROJECT_DIR: projects/CHURCH/timestamp

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pregătește site-ul și generează config.js din GitHub Secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          test -n "$FIREBASE_API_KEY" || { echo "::error::Lipsește secretul FIREBASE_API_KEY"; exit 1; }
          test -n "$ADMIN_EMAIL" || { echo "::error::Lipsește secretul ADMIN_EMAIL"; exit 1; }
          test -f "$PROJECT_DIR/config.template.js" || { echo "::error::Nu găsesc $PROJECT_DIR/config.template.js"; exit 1; }
          mkdir _site
          # tot repository-ul (fișierele urmărite de git) se publică, păstrând folderele
          git ls-files -z | xargs -0 cp --parents -t _site
          # mai puțin fișierele interne și cele de configurare
          rm -rf _site/.github _site/.gitignore
          rm -f "_site/$PROJECT_DIR/config.template.js" "_site/$PROJECT_DIR/config.js" "_site/$PROJECT_DIR/firebase-rules.json"
          python3 - <<'PY'
          import os
          d = os.environ["PROJECT_DIR"]
          t = open(d + "/config.template.js", encoding="utf-8").read()
          for k in ("FIREBASE_API_KEY", "ADMIN_EMAIL"):
              t = t.replace("${" + k + "}", os.environ[k])
          open("_site/" + d + "/config.js", "w", encoding="utf-8").write(t)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4